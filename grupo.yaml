# =============================================================================
#  CONFIGURAÇÃO DO GRUPO - Chatbot de Estágio (UFMS)
#  Este arquivo é lido pelo código base, pelo notebook e pelo script de
#  avaliação. Mantenha a estrutura (nomes das chaves) exatamente como está.
#  As regras vêm da Lei nº 11.788/2008 e da Resolução nº 706-COGRAD/UFMS/2022
#  (ver documentos/FONTES.md).
# =============================================================================

grupo:
  nome: "Grupo Estágio"
  integrantes:          # 3 a 4 integrantes  (completar nomes e RGAs)
    - nome: "Fernanda Lara de Brittes"
      rga: "202519060201"
    - nome: "Willian Carneiro Ferreira"
      rga: "2026.1904.001-6"
    - nome: "Gabriel Moisés Ribeiro Lanzarin"
      rga: "202219070236"

tema:
  nome: "Estágio"
  descricao: >
    Atendimento automático para estudantes de graduação da UFMS com dúvidas sobre
    estágio: obrigatório e não obrigatório, vagas e convênios, termo de compromisso,
    jornada, bolsa, seguro, orientação e relatórios.

dados:                  # caminhos relativos a este arquivo - não altere
  treino: dados/treino.csv
  teste: dados/teste.csv

modelos:                # caminhos relativos a este arquivo - não altere
  escopo: modelos/escopo.joblib
  tema: modelos/tema.joblib

# LLM que REDIGE as respostas do bot (via OpenRouter, com a chave do grupo).
# Os classificadores decidem a ROTA; o LLM só escreve o texto da resposta.
llm:
  modelo: "openai/gpt-6-luna"
  temperatura: 0.3
  max_tokens: 300
  usar_em: [intencoes, chitchat]
  persona: >
    Você é o Estagi, assistente virtual de estágios dos cursos de graduação da UFMS.
    Fale de forma cordial, simples e direta, tratando o estudante por "você".
    Responda somente com base nos trechos dos documentos fornecidos; se a
    informação não estiver neles, diga que não sabe e indique o contato. Nunca
    invente valores, prazos ou datas. Lembre que regras específicas podem variar
    conforme o Projeto Pedagógico de cada curso.
  contato: "a Comissão de Estágio (COE) do seu curso ou o e-mail estagio@ufms.br"
  max_frases: 3
  turnos_historico: 3

conhecimento:
  pasta: documentos
  representacao: tfidf
  tamanho_trecho: 700
  k: 4
  similaridade_minima: 0.05

roteamento:
  # Abaixo desta confiança no tema, o bot pede esclarecimento em vez de responder.
  # Valor escolhido com dados (notebook 01, seção 6, validação cruzada no treino
  # final): 0.30 evita 1 erro sem perder acertos (99,8% respondidas direto). 0.35
  # evitaria 6 erros ao custo de 3 acertos virarem pergunta; como na avaliação
  # automática toda pergunta de esclarecimento conta como erro, ficamos com o
  # valor conservador. Acima de 0.40 os acertos perdidos superam os erros evitados.
  limiar_tema: 0.30

intencoes:
  tipos_estagio:
    descricao: "estágio obrigatório e não obrigatório e quem pode estagiar"
    resposta: >
      O estágio obrigatório faz parte do currículo do seu curso, com carga horária
      definida no Projeto Pedagógico (PPC); o não obrigatório é opcional, feito para
      enriquecer a formação. Para estagiar é preciso estar matriculado e frequentando
      o curso. Horas de estágio não obrigatório podem ser aproveitadas no obrigatório
      se o Colegiado autorizar, via Requerimento Acadêmico.
  vagas_convenio:
    descricao: "vagas de estágio, empresas concedentes, convênios e agentes de integração"
    resposta: >
      As vagas são divulgadas pela Proaes e no Portal do Estágio (estagio.ufms.br).
      Podem conceder estágio empresas, órgãos públicos, a própria UFMS e profissionais
      liberais registrados. O convênio (acordo de cooperação) com a UFMS só é exigido
      se a empresa pedir, mas é obrigatório para agentes de integração como o CIEE.
  termo_compromisso:
    descricao: "termo de compromisso (TCE), assinaturas, termo aditivo e rescisão"
    resposta: >
      Antes de começar, preencha o Termo de Compromisso de Estágio no Portal do
      Estágio (estagio.ufms.br), com seu Passaporte UFMS. A COE valida o termo e ele é
      assinado no SEI por você, pela concedente e pela direção da sua unidade. Para
      prorrogar, faça um Termo Aditivo antes do fim da vigência.
  carga_horaria:
    descricao: "jornada, carga horária, duração máxima e recesso do estágio"
    resposta: >
      A jornada máxima é de 6 horas por dia e 30 horas por semana (até 40 horas nos
      períodos sem aulas, se o PPC permitir). Em semanas de prova, a jornada cai pelo
      menos pela metade. Na mesma empresa, o estágio dura no máximo 2 anos. Quem
      estagia 1 ano tem direito a 30 dias de recesso (proporcional se for menos).
  bolsa_auxilio:
    descricao: "bolsa, remuneração e auxílio-transporte"
    resposta: >
      No estágio não obrigatório, a concedente deve pagar bolsa (ou outra
      contraprestação) e auxílio-transporte. No obrigatório, a bolsa é opcional. O
      valor não é fixado em lei: ele consta no Termo de Compromisso. Receber bolsa não
      cria vínculo de emprego.
  seguro:
    descricao: "seguro contra acidentes pessoais do estagiário"
    resposta: >
      Todo estágio exige seguro contra acidentes pessoais. No estágio obrigatório, a
      UFMS tem uma apólice padrão, e você é incluído ao preencher o Termo de
      Compromisso. No não obrigatório, a empresa contrata o seguro e informa o número
      da apólice para o termo.
  orientador_supervisor:
    descricao: "professor orientador, supervisor de estágio e Comissão de Estágio (COE)"
    resposta: >
      Todo estágio tem um Professor Orientador (professor efetivo da UFMS) e um
      Supervisor na concedente, com formação ou experiência na área do curso; cada
      supervisor pode acompanhar até 10 estagiários. A Comissão de Estágio (COE) do
      curso coordena os estágios, valida termos e aprova supervisores.
  relatorio_avaliacao:
    descricao: "relatórios de atividades, avaliação e conclusão do estágio"
    resposta: >
      Você deve fazer o Relatório de Atividades e enviar ao Professor Orientador a cada
      semestre. O relatório assinado pelo orientador vai para a COE por Requerimento
      Acadêmico até 5 dias antes do fim do período letivo. Os critérios de avaliação
      do estágio obrigatório estão no PPC do curso.

respostas:
  chitchat:
    saudacao: "Olá! Sou o Estagi, assistente de estágios da UFMS. Como posso ajudar?"
    agradecimento: "Por nada! Boa sorte no estágio."
    despedida: "Até logo! Qualquer dúvida sobre estágio, é só chamar."
    padrao: "Sou o assistente virtual de estágios da UFMS e posso ajudar com: {assuntos}."
  fora_dominio: >
    Desculpe, só sei responder sobre estágio: {assuntos}. Para outros assuntos,
    procure a secretaria acadêmica ou a coordenação do seu curso.
  esclarecer: "Não tenho certeza se entendi. Sua dúvida é sobre {opcao1} ou sobre {opcao2}?"
